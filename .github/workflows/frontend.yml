# CI/CD del FRONTEND (raíz del repo): pruebas (Jasmine + Karma) → build (Vite) → EC2 de frontend (nginx en Docker).
# No se ejecuta cuando el cambio es solo del backend o de la base de datos.
#
# GitHub → Settings → Secrets and variables → Actions (secrets y variables del repositorio):
#   Secrets:   FRONT_EC2_HOST, FRONT_EC2_SSH_KEY, EC2_USER
#   Variables: VITE_API_URL  (URL pública del backend, ej. http://<IP-back>:8080/api)
name: Frontend CI/CD

on:
  push:
    # preparacion_backend: rama para probar el despliegue antes de llevarlo a main
    branches: [main, preparacion_backend]
    paths-ignore: ["backend/**", "database/**", ".github/workflows/backend.yml", ".github/workflows/database.yml", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["backend/**", "database/**", ".github/workflows/backend.yml", ".github/workflows/database.yml", "docs/**"]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  DIR_REMOTO: /opt/huertohogar/frontend

jobs:
  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # CI=true (lo define GitHub) hace que Karma use ChromeHeadless sin sandbox.
      - run: npm test

      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/

  build:
    name: Build de producción
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Para desplegar, la URL del backend es obligatoria (vive en otra EC2).
      - name: Verificar VITE_API_URL
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::Falta la variable VITE_API_URL (ej. http://<IP-back>:8080/api) en Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    name: Despliegue en EC2 de frontend
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Instala Docker + Compose y crea /opt/huertohogar si la EC2 es nueva (no hace nada si ya está lista).
      - name: Copiar script de preparación de la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FRONT_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.FRONT_EC2_SSH_KEY }}
          source: "scripts/preparar-ec2.sh"
          target: /tmp/huertohogar
          strip_components: 1

      - name: Preparar la EC2 (Docker, carpeta, swap)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FRONT_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.FRONT_EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            bash /tmp/huertohogar/preparar-ec2.sh
            mkdir -p ${{ env.DIR_REMOTO }}

      - name: Copiar docker-compose.yml y nginx.conf
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FRONT_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.FRONT_EC2_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/nginx.conf"
          target: ${{ env.DIR_REMOTO }}
          strip_components: 1

      - name: Copiar build (a una carpeta temporal)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FRONT_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.FRONT_EC2_SSH_KEY }}
          source: "dist"
          target: ${{ env.DIR_REMOTO }}/dist-nuevo
          strip_components: 1
          rm: true

      - name: Publicar la nueva versión
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FRONT_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.FRONT_EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.DIR_REMOTO }}
            rm -rf dist
            mv dist-nuevo dist
            # --force-recreate: el contenedor vuelve a montar la carpeta dist recién reemplazada.
            docker compose up -d --force-recreate
            sleep 2
            curl -fsS -o /dev/null http://localhost/ && echo "Frontend publicado correctamente"
