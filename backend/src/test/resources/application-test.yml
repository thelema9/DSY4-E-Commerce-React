# Perfil de pruebas: H2 en memoria (modo MySQL), sin depender de un servidor de base de datos.
# Los valores de aquí son solo para las pruebas automatizadas.
spring:
  datasource:
    url: jdbc:h2:mem:huertohogar;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

