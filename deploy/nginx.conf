# nginx de la EC2 de FRONTEND: sirve el build de React como SPA.
# La API está en otra EC2: el navegador la llama directo a VITE_API_URL (http://<IP-back>:8080/api),
# por eso aquí no hay proxy y el backend debe permitir este origen en CORS_ALLOWED_ORIGINS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Archivos con hash en el nombre (Vite): se pueden cachear para siempre.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de React Router (/login, /admin, /admin/usuarios...): siempre index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
